<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chain Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06050e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      transition: filter 0.25s ease;
    }
    #gameCanvas.blurred {
      filter: blur(9px) brightness(0.7);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    (function() {
      // --- NATIVE BRIDGE HELPERS ---
      function notifyNativeGameState(state) {
        if (window.Android && window.Android.onGameStateChanged) {
          window.Android.onGameStateChanged(state);
        }
      }
      function notifyNativeScore(score) {
        if (window.Android && window.Android.updateScore) {
          window.Android.updateScore(score);
        }
      }
      function notifyNativeHighScore(highScore) {
        if (window.Android && window.Android.updateHighScore) {
          window.Android.updateHighScore(highScore);
        }
      }
      function notifyPowerUpCollected(type) {
        if (window.Android && window.Android.collectPowerUp) {
          window.Android.collectPowerUp(type);
        }
      }
      function notifyShieldConsumed() {
        if (window.Android && window.Android.shieldConsumed) {
          window.Android.shieldConsumed();
        }
      }

      // --- POWER-UP SETTERS ---
      let gameTimeScale = 1.0;
      let scoreMultiplier = 1;
      let shieldActive = false;

      window.setTimeScale = function(scale) {
        gameTimeScale = scale;
      };
      window.setScoreMultiplier = function(multiplier) {
        scoreMultiplier = multiplier;
      };
      window.setShield = function(active) {
        shieldActive = active;
      };

      // --- AUDIO & HAPTICS SETTINGS ---
      let soundEnabled = true;
      let hapticsEnabled = true;

      window.setSoundEnabled = function(enabled) {
        soundEnabled = enabled;
      };

      window.setHapticsEnabled = function(enabled) {
        hapticsEnabled = enabled;
      };

      function triggerHaptics(ms = 15) {
        if (hapticsEnabled && window.navigator && window.navigator.vibrate) {
          try {
            window.navigator.vibrate(ms);
          } catch (e) {}
        }
      }

      // --- AUDIO SYNTHESIS ---
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playShootSound() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      function playPopSound() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.09);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }

      function playChainSound(step) {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const pitchMultiplier = 1 + Math.min(step, 8) * 0.15;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sawtooth';
        osc2.type = 'sine';
        const baseFreq = 220 * pitchMultiplier;
        osc1.frequency.setValueAtTime(baseFreq, now);
        osc1.frequency.exponentialRampToValueAtTime(baseFreq * 0.35, now + 0.22);
        osc2.frequency.setValueAtTime(baseFreq * 1.5, now);
        osc2.frequency.exponentialRampToValueAtTime(60, now + 0.22);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.22);
        osc2.stop(now + 0.22);
      }

      function playGameOverSound() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.65);
      }

      // --- CONSTANTS & PALETTE ---
      const NEON_COLORS = [
        { name: 'Cyan', hex: '#00f3ff', rgb: '0, 243, 255' },
        { name: 'Magenta', hex: '#ff007f', rgb: '255, 0, 127' },
        { name: 'Lime', hex: '#39ff14', rgb: '57, 255, 20' },
        { name: 'Yellow', hex: '#ffe600', rgb: '255, 230, 0' }
      ];

      const CHAIN_RADIUS = 110;
      const TURRET_CORE_RADIUS = 26;
      const TARGET_RADIUS = 17;
      const POWERUP_RADIUS = 14;
      const BULLET_RADIUS = 5.5;
      const BULLET_SPEED = 820;
      const HITBOX_PADDING = 16;

      // --- SETUP CANVAS & SIZING ---
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('orientationchange', resize, { passive: true });
      resize();

      // --- OBJECT POOLING FOR PERFORMANCE ---
      const ParticlePool = {
        _pool: [],
        get(x, y, vx, vy, radius, color, rgb, alpha, decay) {
          let p = this._pool.length > 0 ? this._pool.pop() : {};
          p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.radius = radius;
          p.color = color; p.rgb = rgb; p.alpha = alpha; p.decay = decay;
          return p;
        },
        release(p) { this._pool.push(p); }
      };

      const BulletPool = {
        _pool: [],
        get(x, y, vx, vy, color, radius) {
          let b = this._pool.length > 0 ? this._pool.pop() : { trail: [] };
          b.x = x; b.y = y; b.vx = vx; b.vy = vy; b.color = color; b.radius = radius;
          b.trail.length = 0;
          return b;
        },
        release(b) { this._pool.push(b); }
      };

      const ShockwavePool = {
        _pool: [],
        get(x, y, radius, maxRadius, color, rgb, alpha, growth) {
          let s = this._pool.length > 0 ? this._pool.pop() : {};
          s.x = x; s.y = y; s.radius = radius; s.maxRadius = maxRadius;
          s.color = color; s.rgb = rgb; s.alpha = alpha; s.growth = growth;
          return s;
        },
        release(s) { this._pool.push(s); }
      };

      const PowerUpPool = {
        _pool: [],
        get(x, y, vx, vy, type, color) {
          let p = this._pool.length > 0 ? this._pool.pop() : {};
          p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.type = type; p.color = color;
          p.radius = POWERUP_RADIUS; p.pulse = 0;
          return p;
        },
        release(p) { this._pool.push(p); }
      };

      // --- GAME STATE ---
      let gameState = 'START';
      let isPaused = false;
      let score = 0;
      let highScore = 0;
      let maxCombo = 0;
      let currentCombo = 0;
      let comboTimer = 0;
      let gameStartTime = 0;
      let lastFrameTime = performance.now();
      let spawnTimer = 0;
      let powerUpSpawnTimer = 8;
      let baseSpawnInterval = 1.25;
      let screenShake = 0;

      let turretAngle = -Math.PI / 2;
      let currentAmmo = NEON_COLORS[0];
      let nextAmmo = NEON_COLORS[1];
      let turretRecoil = 0;
      let turretPulse = 0;

      let bullets = [];
      let targets = [];
      let powerUps = [];
      let particles = [];
      let floatingTexts = [];
      let shockwaves = [];
      let chainBeams = [];

      function getRandomColor() {
        return NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
      }

      window.setPaused = function(paused) {
        if (gameState !== 'PLAYING') return;
        isPaused = paused;
        if (isPaused) {
          canvas.classList.add('blurred');
        } else {
          canvas.classList.remove('blurred');
          lastFrameTime = performance.now();
        }
      };

      window.startGame = function() {
        initAudio();
        triggerHaptics(30);
        score = 0;
        maxCombo = 0;
        currentCombo = 0;
        comboTimer = 0;

        // Release entities to pools
        bullets.forEach(b => BulletPool.release(b));
        targets.forEach(t => { /* targets don't have a pool currently but we should clear them */ });
        powerUps.forEach(p => PowerUpPool.release(p));
        particles.forEach(p => ParticlePool.release(p));
        shockwaves.forEach(s => ShockwavePool.release(s));

        bullets.length = 0;
        targets.length = 0;
        powerUps.length = 0;
        particles.length = 0;
        floatingTexts.length = 0;
        shockwaves.length = 0;
        chainBeams.length = 0;

        gameTimeScale = 1.0;
        scoreMultiplier = 1;
        shieldActive = false;

        screenShake = 0;
        turretAngle = -Math.PI / 2;
        currentAmmo = getRandomColor();
        nextAmmo = getRandomColor();
        turretRecoil = 0;
        turretPulse = 0;
        gameStartTime = performance.now();
        lastFrameTime = performance.now();
        spawnTimer = 0.5;
        powerUpSpawnTimer = 5 + Math.random() * 5;
        isPaused = false;
        gameState = 'PLAYING';
        canvas.classList.remove('blurred');
        notifyNativeGameState('PLAYING');
        notifyNativeScore(0);
      };

      function gameOver() {
        gameState = 'GAMEOVER';
        notifyNativeGameState('GAMEOVER');
        playGameOverSound();
        triggerHaptics(80);
        screenShake = 22;

        const cx = width / 2;
        const cy = height / 2;

        for (let p = 0; p < 45; p++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 60 + Math.random() * 260;
          particles.push(ParticlePool.get(cx, cy, Math.cos(ang) * spd, Math.sin(ang) * spd, 3 + Math.random() * 4, '#ff007f', '255, 0, 127', 1, 0.9));
        }
        shockwaves.push(ShockwavePool.get(cx, cy, 10, Math.max(width, height) * 0.7, '#ff007f', '255, 0, 127', 1, 450));
      }

      // --- DELTA TIME OPTIMIZED SYSTEMS ---
      function getSmartAmmoColor() {
        if (!targets || targets.length === 0) return getRandomColor();
        const cx = width / 2;
        const cy = height / 2;

        // Optimize: Avoid allocation and sorting, just find closest
        let closest = targets[0];
        let minDistSq = Infinity;
        const poolSize = Math.min(3, targets.length);

        // Simple heuristic: pick randomly from first few in list (often older/closer) or actually check distance
        // For performance, we'll just pick one of the first 3 active targets to avoid full sort
        return targets[Math.floor(Math.random() * poolSize)].color;
      }

      function pickNextAmmo() {
        return getSmartAmmoColor();
      }

      function fireBullet(targetX, targetY) {
        const cx = width / 2;
        const cy = height / 2;
        const dx = targetX - cx;
        const dy = targetY - cy;
        const angle = Math.atan2(dy, dx);
        turretAngle = angle;
        turretRecoil = 9;
        const barrelLength = TURRET_CORE_RADIUS + 18;
        const bx = cx + Math.cos(angle) * barrelLength;
        const by = cy + Math.sin(angle) * barrelLength;

        bullets.push(BulletPool.get(bx, by, Math.cos(angle) * BULLET_SPEED, Math.sin(angle) * BULLET_SPEED, currentAmmo, BULLET_RADIUS));

        for (let i = 0; i < 7; i++) {
          const pAngle = angle + (Math.random() - 0.5) * 0.8;
          const pSpeed = 120 + Math.random() * 160;
          particles.push(ParticlePool.get(bx, by, Math.cos(pAngle) * pSpeed, Math.sin(pAngle) * pSpeed, 2.5 + Math.random() * 2, currentAmmo.hex, currentAmmo.rgb, 1, 2.8 + Math.random() * 2));
        }
        playShootSound();
        triggerHaptics(12);
        currentAmmo = nextAmmo;
        nextAmmo = pickNextAmmo();
      }

      function spawnTarget() {
        const cx = width / 2;
        const cy = height / 2;
        let sx, sy;
        const edge = Math.floor(Math.random() * 4);
        const margin = TARGET_RADIUS + 15;
        if (edge === 0) { sx = Math.random() * width; sy = -margin; }
        else if (edge === 1) { sx = width + margin; sy = Math.random() * height; }
        else if (edge === 2) { sx = Math.random() * width; sy = height + margin; }
        else { sx = -margin; sy = Math.random() * height; }
        const dx = cx - sx;
        const dy = cy - sy;
        const dist = Math.hypot(dx, dy);
        const elapsedSec = (performance.now() - gameStartTime) / 1000;
        const baseSpeed = 58 + Math.min(elapsedSec * 0.8, 55) + Math.min(score * 0.015, 35);
        const speed = baseSpeed * (0.9 + Math.random() * 0.2);
        targets.push({
          id: Math.random().toString(36).substr(2, 9), x: sx, y: sy,
          vx: (dx / dist) * speed, vy: (dy / dist) * speed,
          color: getRandomColor(), radius: TARGET_RADIUS, pulse: Math.random() * Math.PI * 2
        });
      }

      function spawnPowerUp() {
        const cx = width / 2;
        const cy = height / 2;
        let sx, sy;
        const edge = Math.floor(Math.random() * 4);
        const margin = POWERUP_RADIUS + 15;
        if (edge === 0) { sx = Math.random() * width; sy = -margin; }
        else if (edge === 1) { sx = width + margin; sy = Math.random() * height; }
        else if (edge === 2) { sx = Math.random() * width; sy = height + margin; }
        else { sx = -margin; sy = Math.random() * height; }

        const dx = cx - sx;
        const dy = cy - sy;
        const dist = Math.hypot(dx, dy);
        const speed = 70 + Math.random() * 40;

        const types = ['DOUBLE_XP', 'SLOW_MOTION', 'SHIELD'];
        const type = types[Math.floor(Math.random() * types.length)];
        const colorMap = { 'DOUBLE_XP': '#ffe600', 'SLOW_MOTION': '#00f3ff', 'SHIELD': '#39ff14' };

        powerUps.push(PowerUpPool.get(sx, sy, (dx / dist) * speed, (dy / dist) * speed, type, colorMap[type]));
      }

      function createExplosion(x, y, color, isChain) {
        const particleCount = isChain ? 18 : 10;
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (isChain ? 110 : 70) + Math.random() * (isChain ? 170 : 100);
          particles.push(ParticlePool.get(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, (isChain ? 2.8 : 2) + Math.random() * 2.2, color.hex, color.rgb, 1, isChain ? 1.6 : 2.4));
        }
        shockwaves.push(ShockwavePool.get(x, y, 6, isChain ? 58 : 34, color.hex, color.rgb, 0.9, isChain ? 180 : 130));
        if (isChain) { screenShake = Math.min(screenShake + 4.5, 14); triggerHaptics(35); }
        else { triggerHaptics(18); }
      }

      function addFloatingText(text, x, y, colorHex, size = 18) {
        floatingTexts.push({ text: text, x: x, y: y, color: colorHex, size: size, alpha: 1, vy: -55 });
      }

      function triggerChainReaction(initialTarget, bulletColor) {
        let chainList = [initialTarget];
        let visited = new Set();
        visited.add(initialTarget.id);
        let queue = [initialTarget];
        while (queue.length > 0) {
          const current = queue.shift();
          for (let i = 0; i < targets.length; i++) {
            const candidate = targets[i];
            if (!visited.has(candidate.id) && candidate.color.hex === bulletColor.hex) {
              const d = Math.hypot(candidate.x - current.x, candidate.y - current.y);
              if (d <= CHAIN_RADIUS) { visited.add(candidate.id); queue.push(candidate); chainList.push(candidate); }
            }
          }
        }
        const isMultiChain = chainList.length > 1;
        currentCombo += chainList.length;
        if (currentCombo > maxCombo) maxCombo = currentCombo;
        comboTimer = 2.4;
        chainList.forEach((target, index) => {
          setTimeout(() => {
            if (gameState !== 'PLAYING' || isPaused) return;
            const idx = targets.findIndex(t => t.id === target.id);
            if (idx !== -1) targets.splice(idx, 1);
            const points = (isMultiChain ? (30 + index * 25) : 25) * scoreMultiplier;
            score += points;
            notifyNativeScore(score);
            createExplosion(target.x, target.y, bulletColor, true);
            playChainSound(index);
            if (index > 0) {
              const prev = chainList[index - 1];
              chainBeams.push({ x1: prev.x, y1: prev.y, x2: target.x, y2: target.y, color: bulletColor.hex, alpha: 1 });
            }
            if (index === 0 && !isMultiChain) {
              addFloatingText(`+${points}`, target.x, target.y - 12, bulletColor.hex, 16);
            } else {
              addFloatingText(`CHAIN x${index + 1} +${points}`, target.x, target.y - 14, bulletColor.hex, 17 + Math.min(index * 2, 10));
            }
          }, index * 70);
        });
      }

      function handleHit(bullet, target, bIdx) {
        bullets.splice(bIdx, 1);
        BulletPool.release(bullet);
        if (bullet.color.hex === target.color.hex) {
          triggerChainReaction(target, bullet.color);
        } else {
          const tIdx = targets.findIndex(t => t.id === target.id);
          if (tIdx !== -1) targets.splice(tIdx, 1);
          const points = 5 * scoreMultiplier;
          score += points;
          notifyNativeScore(score);
          createExplosion(target.x, target.y, target.color, false);
          playPopSound();
          addFloatingText(`+${points}`, target.x, target.y - 10, '#ffffff', 14);
        }
      }

      function handlePointerAction(e) {
        if (gameState !== 'PLAYING' || isPaused) return;
        e.preventDefault();
        initAudio();
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
        const tapX = clientX - rect.left, tapY = clientY - rect.top;
        const cx = width / 2, cy = height / 2;
        const distToCenter = Math.hypot(tapX - cx, tapY - cy);
        if (distToCenter < TURRET_CORE_RADIUS + 12) {
          const temp = currentAmmo; currentAmmo = nextAmmo; nextAmmo = temp;
          playPopSound(); triggerHaptics(15); turretPulse = 1.0; return;
        }
        fireBullet(tapX, tapY);
      }

      canvas.addEventListener('touchstart', handlePointerAction, { passive: false });
      canvas.addEventListener('pointerdown', function(e) { if (e.pointerType === 'mouse') handlePointerAction(e); }, { passive: false });
      window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      window.addEventListener('contextmenu', e => e.preventDefault());

      function update(dt) {
        const effectiveDt = dt * (gameState === 'PLAYING' ? gameTimeScale : 1.0);

        turretPulse = Math.max(0, turretPulse - dt * 3);
        if (turretRecoil > 0) turretRecoil = Math.max(0, turretRecoil - dt * 45);
        if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 25);
        if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) currentCombo = 0; }
        if (gameState !== 'PLAYING' || isPaused) return;
        const cx = width / 2, cy = height / 2;

        spawnTimer -= dt; // Spawning is relative to real time, or maybe game time? Let's use real time for spawn rhythm
        if (spawnTimer <= 0) {
          spawnTarget();
          const elapsedSec = (performance.now() - gameStartTime) / 1000;
          spawnTimer = Math.max(0.48, baseSpawnInterval - elapsedSec * 0.012 - (score * 0.0006));
        }

        powerUpSpawnTimer -= dt;
        if (powerUpSpawnTimer <= 0) {
          spawnPowerUp();
          powerUpSpawnTimer = 12 + Math.random() * 8;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.trail.push({ x: b.x, y: b.y, alpha: 1 });
          if (b.trail.length > 5) b.trail.shift();
          const prevX = b.x, prevY = b.y;
          b.x += b.vx * dt; b.y += b.vy * dt; // Bullets use real time speed
          for (let t of b.trail) t.alpha -= dt * 4.5;
          if (b.x < -60 || b.x > width + 60 || b.y < -60 || b.y > height + 60) { bullets.splice(i, 1); BulletPool.release(b); continue; }

          const hitThreshold = b.radius + TARGET_RADIUS + HITBOX_PADDING;
          const hitThresholdSq = hitThreshold * hitThreshold;

          const pUpThreshold = b.radius + POWERUP_RADIUS + HITBOX_PADDING;
          const pUpThresholdSq = pUpThreshold * pUpThreshold;

          const segDx = b.x - prevX, segDy = b.y - prevY, l2 = segDx * segDx + segDy * segDy;

          // Check power-up hits
          for (let j = powerUps.length - 1; j >= 0; j--) {
            const p = powerUps[j];
            const dx = p.x - b.x, dy = p.y - b.y;
            if (dx*dx + dy*dy <= pUpThresholdSq) {
              notifyPowerUpCollected(p.type);
              addFloatingText(p.type.replace('_', ' '), p.x, p.y - 20, p.color, 20);
              powerUps.splice(j, 1);
              PowerUpPool.release(p);
              bullets.splice(i, 1);
              BulletPool.release(b);
              triggerHaptics(40);
              break;
            }
          }
          if (i >= bullets.length) continue; // Bullet was spliced

          for (let j = 0; j < targets.length; j++) {
            const tg = targets[j]; let distSq;
            if (l2 === 0) { const dx = tg.x - b.x, dy = tg.y - b.y; distSq = dx * dx + dy * dy; }
            else {
              let t = ((tg.x - prevX) * segDx + (tg.y - prevY) * segDy) / l2;
              t = Math.max(0, Math.min(1, t));
              const dx = tg.x - (prevX + t * segDx), dy = tg.y - (prevY + t * segDy);
              distSq = dx * dx + dy * dy;
            }
            if (distSq <= hitThresholdSq) { handleHit(b, tg, i); break; }
          }
        }

        for (let i = powerUps.length - 1; i >= 0; i--) {
          const p = powerUps[i];
          p.x += p.vx * effectiveDt; p.y += p.vy * effectiveDt; p.pulse += effectiveDt * 5;
          if (p.x < -60 || p.x > width + 60 || p.y < -60 || p.y > height + 60) { powerUps.splice(i, 1); PowerUpPool.release(p); }
        }

        for (let i = targets.length - 1; i >= 0; i--) {
          const tg = targets[i];
          tg.x += tg.vx * effectiveDt; tg.y += tg.vy * effectiveDt; tg.pulse += effectiveDt * 4.5;
          if (Math.hypot(tg.x - cx, tg.y - cy) <= tg.radius + TURRET_CORE_RADIUS - 3) {
            if (shieldActive) {
              targets.splice(i, 1);
              createExplosion(tg.x, tg.y, tg.color, false);
              playPopSound();
              triggerHaptics(30);
              addFloatingText("BLOCKED!", tg.x, tg.y - 10, '#39ff14', 16);
            } else {
              gameOver();
              break;
            }
          }
        }

        for (let i = chainBeams.length - 1; i >= 0; i--) { chainBeams[i].alpha -= effectiveDt * 3.2; if (chainBeams[i].alpha <= 0) chainBeams.splice(i, 1); }
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i]; sw.radius += sw.growth * effectiveDt; sw.alpha -= effectiveDt * (sw.growth / (sw.maxRadius * 0.85));
          if (sw.radius >= sw.maxRadius || sw.alpha <= 0) { shockwaves.splice(i, 1); ShockwavePool.release(sw); }
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i]; p.x += p.vx * effectiveDt; p.y += p.vy * effectiveDt; p.vx *= 0.97; p.vy *= 0.97; p.alpha -= p.decay * effectiveDt;
          if (p.alpha <= 0) { particles.splice(i, 1); ParticlePool.release(p); }
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i]; ft.y += ft.vy * dt; ft.alpha -= dt * 1.35;
          if (ft.alpha <= 0) floatingTexts.splice(i, 1);
        }
      }

      function draw() {
        ctx.save();
        if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        ctx.fillStyle = '#070611'; ctx.fillRect(0, 0, width, height);
        const cx = width / 2, cy = height / 2;
        const bgGradient = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(width, height) * 0.65);
        bgGradient.addColorStop(0, 'rgba(28, 16, 56, 0.45)'); bgGradient.addColorStop(0.7, 'rgba(10, 8, 22, 0.85)'); bgGradient.addColorStop(1, 'rgba(6, 5, 14, 1.0)');
        ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, width, height);
        ctx.lineWidth = 1;
        for (let r = 80; r <= Math.max(width, height); r += 90) { ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
        for (let beam of chainBeams) {
          ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = beam.color; ctx.globalAlpha = Math.max(0, beam.alpha); ctx.shadowColor = beam.color; ctx.shadowBlur = 15;
          ctx.beginPath(); ctx.moveTo(beam.x1, beam.y1); ctx.lineTo((beam.x1 + beam.x2) / 2 + (Math.random() - 0.5) * 16, (beam.y1 + beam.y2) / 2 + (Math.random() - 0.5) * 16); ctx.lineTo(beam.x2, beam.y2); ctx.stroke(); ctx.restore();
        }
        for (let sw of shockwaves) { ctx.save(); ctx.strokeStyle = sw.color; ctx.lineWidth = 2.5; ctx.globalAlpha = Math.max(0, sw.alpha); ctx.shadowColor = sw.color; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
        for (let p of powerUps) {
          ctx.save();
          const r = p.radius * (1 + Math.sin(p.pulse) * 0.15);
          ctx.shadowColor = p.color; ctx.shadowBlur = 15; ctx.lineWidth = 3; ctx.strokeStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          let symbol = '?';
          if (p.type === 'DOUBLE_XP') symbol = '2X';
          else if (p.type === 'SLOW_MOTION') symbol = 'S';
          else if (p.type === 'SHIELD') symbol = 'H';
          ctx.fillText(symbol, p.x, p.y);
          ctx.restore();
        }
        for (let tg of targets) {
          ctx.save(); const r = tg.radius * (1 + Math.sin(tg.pulse) * 0.08); ctx.shadowColor = tg.color.hex; ctx.shadowBlur = 14; ctx.lineWidth = 2.8; ctx.strokeStyle = tg.color.hex; ctx.beginPath(); ctx.arc(tg.x, tg.y, r, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = `rgba(${tg.color.rgb}, 0.35)`; ctx.beginPath(); ctx.arc(tg.x, tg.y, r * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(tg.x, tg.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
        for (let b of bullets) {
          ctx.save(); for (let i = 0; i < b.trail.length; i++) { const tr = b.trail[i], frac = (i + 1) / b.trail.length; ctx.fillStyle = `rgba(${b.color.rgb}, ${tr.alpha * 0.45 * frac})`; ctx.beginPath(); ctx.arc(tr.x, tr.y, b.radius * frac, 0, Math.PI * 2); ctx.fill(); }
          ctx.shadowColor = b.color.hex; ctx.shadowBlur = 16; ctx.fillStyle = b.color.hex; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
        for (let p of particles) { ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        ctx.save(); ctx.translate(cx, cy);
        if (gameState === 'PLAYING') {
          let minD = 9999; for (let tg of targets) { const d = Math.hypot(tg.x - cx, tg.y - cy); if (d < minD) minD = d; }
          if (minD < 140) { ctx.strokeStyle = `rgba(255, 30, 80, ${Math.sin(performance.now() * 0.015) * 0.3 + 0.35})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, TURRET_CORE_RADIUS + 14, 0, Math.PI * 2); ctx.stroke(); }
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, TURRET_CORE_RADIUS + 6, 0, Math.PI * 2); ctx.stroke();
        const orbitA = performance.now() * 0.002, orbitR = TURRET_CORE_RADIUS + 6;
        ctx.shadowColor = nextAmmo.hex; ctx.shadowBlur = 10; ctx.fillStyle = nextAmmo.hex; ctx.beginPath(); ctx.arc(Math.cos(orbitA) * orbitR, Math.sin(orbitA) * orbitR, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.save(); ctx.rotate(turretAngle);
        const bW = 7; ctx.shadowColor = currentAmmo.hex; ctx.shadowBlur = 12; ctx.fillStyle = '#1c1833'; ctx.strokeStyle = currentAmmo.hex; ctx.lineWidth = 2; ctx.fillRect(8 - turretRecoil, -bW / 2, 24, bW); ctx.strokeRect(8 - turretRecoil, -bW / 2, 24, bW);
        ctx.fillStyle = currentAmmo.hex; ctx.fillRect(10 - turretRecoil, -bW / 2 + 2, 20, bW - 4); ctx.restore();
        ctx.shadowColor = currentAmmo.hex; ctx.shadowBlur = 18; ctx.fillStyle = '#100c22'; ctx.beginPath(); ctx.arc(0, 0, TURRET_CORE_RADIUS, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = currentAmmo.hex; ctx.beginPath(); ctx.arc(0, 0, TURRET_CORE_RADIUS - 1, 0, Math.PI * 2); ctx.stroke();

        if (shieldActive) {
          ctx.save();
          ctx.strokeStyle = '#39ff14';
          ctx.lineWidth = 3.5;
          ctx.setLineDash([6, 6]);
          ctx.lineDashOffset = performance.now() * 0.05;
          ctx.shadowColor = '#39ff14';
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(0, 0, TURRET_CORE_RADIUS + 14, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = 'rgba(57, 255, 20, 0.12)';
          ctx.beginPath();
          ctx.arc(0, 0, TURRET_CORE_RADIUS + 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        const coreR = (TURRET_CORE_RADIUS * 0.55) * (1 + turretPulse * 0.35);
        ctx.fillStyle = currentAmmo.hex; ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, coreR * 0.45, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        for (let ft of floatingTexts) { ctx.save(); ctx.globalAlpha = Math.max(0, ft.alpha); ctx.font = `bold ${ft.size}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = ft.color; ctx.shadowBlur = 10; ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore(); }
        if (gameState === 'PLAYING' && currentCombo > 1) { ctx.save(); ctx.textAlign = 'center'; ctx.font = 'italic 900 18px sans-serif'; ctx.fillStyle = '#ffe600'; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 14; ctx.fillText(`${currentCombo}x COMBO`, cx, 30); ctx.restore(); }
        ctx.restore();
      }

      function gameLoop(now) {
        requestAnimationFrame(gameLoop);
        const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
        lastFrameTime = now;
        update(dt);
        draw();
      }
      requestAnimationFrame(gameLoop);
      notifyNativeGameState('START');
    })();
  </script>
</body>
</html>
